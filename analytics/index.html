<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f8f7f2">
  <title>アクセス解析 | TOTOYA</title>
  <link rel="icon" href="/assets/totoya-icon-32.png" type="image/png">
  <link rel="stylesheet" href="./dashboard.css">
  <script defer src="./dashboard.js"></script>
</head>
<body>
  <header class="masthead"><div class="frame masthead-inner">
    <a href="/ja/" aria-label="Totoya ブランドサイトのトップ"><img src="/assets/totoya-official-logo.webp" width="1059" height="450" alt="TOTOYA"></a>
    <a class="site-link" href="/ja/">ブランドサイトへ</a>
  </div></header>
  <main class="frame">
    <div class="title-row"><div><h1>アクセス解析</h1><p class="period-range" id="period-range">ハワイ時間（HST）</p></div>
      <button type="button" class="refresh" id="refresh">更新</button>
    </div>
    <div class="controls">
      <div class="period-buttons" role="group" aria-label="集計期間">
        <button type="button" data-period="today" aria-pressed="false">今日</button>
        <button type="button" data-period="yesterday" aria-pressed="false">昨日</button>
        <button type="button" data-period="7" aria-pressed="true">7日間</button>
        <button type="button" data-period="30" aria-pressed="false">30日間</button>
        <button type="button" data-period="90" aria-pressed="false">90日間</button>
      </div>
      <p class="fetched" id="fetched-at"></p>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">集計を読み込んでいます…</p>
    <noscript><p>集計を表示するには、ブラウザでJavaScriptを有効にしてください。</p></noscript>

    <div id="report" hidden>
      <section aria-label="アクセスとクリックの合計" class="metrics">
        <dl class="traffic"><div><dt>訪問ブラウザ数</dt><dd data-metric="visitors"></dd></div>
          <div><dt>セッション数</dt><dd data-metric="sessions"></dd></div>
          <div><dt>ページ閲覧数</dt><dd data-metric="pageviews"></dd></div></dl>
        <dl class="outbound"><div><dt>予約クリック</dt><dd data-metric="reservationClicks"></dd></div>
          <div><dt>注文クリック</dt><dd data-metric="orderClicks"></dd></div></dl>
      </section>

      <div class="report-grid">
        <section class="panel trends" aria-labelledby="trend-title">
          <h2 id="trend-title">日別のページ閲覧数</h2>
          <div id="chart-empty" class="empty" hidden>この期間の閲覧はまだ記録されていません。</div>
          <div id="chart" aria-hidden="true" class="chart">
            <div class="chart-scale"><span id="scale-top"></span><span id="scale-mid"></span><span>0</span></div>
            <div class="chart-bars" id="chart-bars"></div>
            <div class="chart-dates" id="chart-dates"></div>
          </div>
          <details class="daily-details"><summary>日別の数値を見る</summary>
            <table><thead><tr><th scope="col">日付</th><th scope="col">ブラウザ</th><th scope="col">セッション</th><th scope="col">閲覧</th></tr></thead>
              <tbody id="daily-rows"></tbody></table>
          </details>
        </section>
        <section class="panel stores" aria-labelledby="stores-title">
          <h2 id="stores-title">店舗別のクリック数</h2>
          <p class="definition">各店の予約・注文サービスへ進んだ回数です。</p>
          <table><thead><tr><th scope="col">店舗</th><th scope="col">予約</th><th scope="col">注文</th></tr></thead><tbody id="shop-rows"></tbody></table>
        </section>
        <section class="panel pages" aria-labelledby="pages-title">
          <h2 id="pages-title">閲覧されたページ</h2>
          <p class="empty" id="pages-empty" hidden>この期間のページ閲覧はありません。</p>
          <table id="pages-table"><thead><tr><th scope="col">ページ</th><th scope="col">閲覧数</th></tr></thead><tbody id="page-rows"></tbody></table>
        </section>
        <section class="panel channels" aria-labelledby="channels-title">
          <h2 id="channels-title">流入元</h2>
          <p class="empty" id="channels-empty" hidden>この期間の流入データはありません。</p>
          <table id="channels-table"><thead><tr><th scope="col">経路</th><th scope="col">セッション</th><th scope="col">閲覧数</th></tr></thead><tbody id="source-rows"></tbody></table>
        </section>
      </div>
    </div>
  </main>
  <footer class="frame"><span>TOTOYA Hawaii</span><a href="/ja/privacy/">プライバシー</a></footer>
</body></html>
